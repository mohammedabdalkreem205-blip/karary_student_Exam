<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14908f"/>
      <stop offset="0.55" stop-color="#0a5d5f"/>
      <stop offset="1" stop-color="#03272c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#3fd0c4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3fd0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.45" stop-color="#ffcf3f"/>
      <stop offset="1" stop-color="#d9930d"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a91c"/>
      <stop offset="1" stop-color="#b9740a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bfeeea" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="0.5" stop-color="#c88a12" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd54a"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#00161a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="17" y="17" width="478" height="478" rx="97" fill="none" stroke="url(#ring)" stroke-width="3.5" opacity="0.85"/>

  <!-- ascending bars -->
  <g filter="url(#sh)">
    <rect x="132" y="352" width="56" height="70" rx="14" fill="url(#glass)"/>
    <rect x="228" y="312" width="56" height="110" rx="14" fill="url(#glass)"/>
    <rect x="324" y="272" width="56" height="150" rx="14" fill="url(#gold)"/>
  </g>
  <rect x="324" y="272" width="56" height="150" rx="14" fill="none" stroke="#fff6c9" stroke-opacity="0.6" stroke-width="2"/>

  <!-- graduation cap -->
  <g filter="url(#sh)">
    <path d="M186 172v50c0 22 32 38 70 38s70-16 70-38v-50z" fill="url(#goldDark)"/>
    <path d="M256 88 L392 144 L256 200 L120 144 Z" fill="url(#gold)"/>
  </g>
  <path d="M256 88 L392 144 L256 200" fill="none" stroke="#fffbe0" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
  <path d="M256 200 L256 144" stroke="#b9740a" stroke-opacity="0.35" stroke-width="2"/>
  <!-- tassel -->
  <path d="M370 154v62" stroke="#c98a10" stroke-width="7" stroke-linecap="round"/>
  <circle cx="370" cy="222" r="10" fill="url(#gold)"/>

  <!-- sparkle -->
  <path d="M424 70l7 19 19 7-19 7-7 19-7-19-19-7 19-7z" fill="#fff6c9" opacity="0.95"/>
  <path d="M96 252l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#fff6c9" opacity="0.6"/>
</svg>
